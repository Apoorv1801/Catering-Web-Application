# All real values are supplied as environment variables on the hosting
# platform (Render), never committed here. Local defaults after the ':'
# let this still work with your local MySQL/Gmail setup during development
# if you export the same variable names, or you can keep a separate local
# application-local.properties (gitignored) for that instead.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/royal_caterers}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Email / OTP Configuration ──────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Render assigns a PORT env var at runtime; 8080 is the local fallback.
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins for CORS (read by
# CorsConfig.java). Includes your Live Server default for local dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
